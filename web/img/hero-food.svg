    <circle cx="300" cy="318" r="8"/><circle cx="366" cy="338" r="9"/><circle cx="262" cy="292" r="7"/>
    <circle cx="330" cy="275" r="8"/><circle cx="410" cy="320" r="7"/><circle cx="318" cy="370" r="7"/>
  </g>
  <g fill="#2F6B3C">
