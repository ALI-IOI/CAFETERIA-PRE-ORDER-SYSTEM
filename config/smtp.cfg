# SMTP account for notification emails (proposal section 11).
# [CONFIRM] Until host and sender are real values, every email is written to
# data/outbox/ instead of being sent. The password is NOT stored here: set the
# CAFE_SMTP_PASSWORD environment variable before starting the server.
host=[CONFIRM: SMTP host, e.g. the dedicated sender account's server]
port=465
sender=[CONFIRM: sender address]
# username=  (only if different from sender)
