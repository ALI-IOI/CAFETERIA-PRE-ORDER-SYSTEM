# Online demo: builds the pages from web/ with pages-demo/build_demo.cpp, adding
# pages-demo/demo-api.js (an in-browser stand-in for the C++ server, fake data
# only), and publishes them on GitHub Pages.
name: Online demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo site (C++17)
        run: |
          g++ -std=c++17 -O2 -o build_demo pages-demo/build_demo.cpp
          ./build_demo _site "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
